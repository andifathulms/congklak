# Ruleset validation gates the deploy (invariant 8). `pnpm build` runs
# rulesets:validate first, so an uncited pack fails here rather than
# shipping.
#
# Action versions and node-version are two separate things, and both were
# stale. The actions each declare their own JS runtime: five of the six
# here declared node20, which the runners now force onto node24 while
# warning about it. node-version is what actually runs our build and
# tests, and Node 20 went end-of-life in April 2026.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rulesets:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # basePath harus sama dengan nama repositori, atau seluruh aset
      # menggantung 404 di Pages.
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Pastikan .nojekyll ada di akar keluaran
        run: test -f out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
